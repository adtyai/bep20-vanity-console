{{define "setup"}}
{{template "head" .}}
<form class="panel" method="post" action="/setup">
  <h2>创建管理员</h2>
  <p class="muted">只创建一次。创建后这个页面不再存在，也不能找回密码。</p>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <label>用户名<input name="username" maxlength="64" autocomplete="username" required value="{{.Username}}"></label>
  <label>密码<input type="password" name="password" minlength="16" maxlength="256" autocomplete="new-password" required></label>
  <label>重复密码<input type="password" name="password2" minlength="16" maxlength="256" autocomplete="new-password" required></label>
  <label>启动口令<input type="password" name="setup_token" minlength="16" autocomplete="off" required></label>
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <button type="submit">创建</button>
</form>
{{template "foot" .}}
{{end}}
